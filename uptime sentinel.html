<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uptime Sentinel</title>
<style>
body { background:#0d1117; color:#e6edf3; font-family:"Segoe UI",Arial,sans-serif;
       margin:0; }
header { background:#010409; border-bottom:1px solid #21262d; padding:22px 32px; }
header h1 { margin:0; font-size:24px; }
header p { color:#8b949e; font-size:14px; margin:4px 0 0; }
main { max-width:1150px; margin:0 auto; padding:26px 32px; }
.box { background:#161b22; border:1px solid #21262d; border-radius:10px;
       padding:16px 18px; margin-bottom:18px; }
.box h3 { margin:0 0 10px; font-size:15px; }
form { display:inline; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
input { background:#0d1117; border:1px solid #30363d; border-radius:6px;
        color:#e6edf3; padding:8px 10px; font-size:14px; font-family:inherit; }
.wide { flex:1; min-width:220px; }
button { background:#21262d; border:1px solid #30363d; border-radius:6px;
         color:#e6edf3; padding:8px 14px; font-size:14px; font-family:inherit; cursor:pointer; }
button:hover { background:#30363d; }
.green { background:#238636; border-color:#2ea043; }
.red { background:#8b2b2b; border-color:#f85149; }
.controls { display:flex; gap:10px; align-items:center; margin-bottom:20px;
            flex-wrap:wrap; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
         gap:18px; }
.card { background:#161b22; border:1px solid #21262d; border-left:4px solid #30363d;
        border-radius:10px; padding:18px; position:relative; }
.card.up { border-left-color:#2ea043; }
.card.down { border-left-color:#f85149; }
.card h2 { margin:0; font-size:17px; display:inline; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%;
       margin-right:8px; }
.up .dot { background:#2ea043; } .down .dot { background:#f85149; }
.url { color:#8b949e; font-size:12px; margin:8px 0 12px; word-break:break-all; }
.line { font-size:14px; margin:0 0 5px; }
.name { color:#8b949e; display:inline-block; width:150px; }
.value { font-weight:bold; }
.ok { color:#2ea043; } .bad { color:#f85149; } .warn { color:#d29922; }
.small { color:#6e7681; font-size:12px; margin-top:10px; }
.x { position:absolute; top:10px; right:10px; }
.x button { background:none; border:none; color:#6e7681; font-size:15px; }
.x button:hover { color:#f85149; background:none; }
.log { background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:12px;
       font-family:Consolas,monospace; font-size:12px; line-height:1.7;
       max-height:200px; overflow-y:auto; color:#8b949e; }
footer { border-top:1px solid #21262d; color:#6e7681; font-size:12px;
         text-align:center; padding:16px; }
</style>
</head>
<body>

<header>
  <h1>Uptime Sentinel</h1>
</header>

<main>
  <div class="box">
    <h3>Add a website</h3>
    <div class="row">
      <input id="in-name" placeholder="Name (e.g. GitHub)" autocomplete="off">
      <input id="in-url" class="wide" placeholder="https://example.com" autocomplete="off">
      <input id="in-interval" type="number" value="60" min="5" style="width:90px" aria-label="Seconds between checks">
      <button class="green" id="btn-add">Add website</button>
    </div>
  </div>

  <div class="box">
    <h3>Email alerts (optional &mdash; emailed when a website goes DOWN or comes back UP)</h3>
    <div class="row">
      <input id="in-email" type="email" class="wide" placeholder="your@email.com (leave empty to disable)" autocomplete="email">
      <button id="btn-save-email">Save</button>
      <button id="btn-test">Send test alert</button>
    </div>
  </div>

  <div class="controls">
    <button class="green" id="btn-check">Check all now</button>
    <button id="btn-toggle">Stop monitoring</button>
    <button class="red" id="btn-clear">Clear history</button>
    <span style="color:#8b949e;font-size:14px">Monitoring: <b id="mon-state" class="ok">running</b></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="box" style="margin-top:22px">
    <h3>Activity log</h3>
    <div class="log" id="log" aria-live="polite"></div>
  </div>
</main>

<footer>Uptime Sentinel &mdash; by Md Tanvir Ahmmed</footer>

<script>

const TIMEOUT      = 10;    
const SSL_WARN_DAYS = 14;   
const RETAIN_DAYS  = 7;     
const MAX_HISTORY  = 400;   
const MAX_LOG      = 50;    
const STORE_KEY    = "uptime-sentinel:state";

const ALERT_ENDPOINT = "";


const SSL_LOOKUP = "https://ssl-checker.io/api/v1/check/{host}";

const FIRST_RUN_SITES = [
  { name: "Google", url: "https://www.google.com", interval: 60 },
  { name: "GitHub", url: "https://github.com",     interval: 60 }
];


let state = { sites: [], monitoring: true, nextId: 1, email: "" };
let logLines = [];
let busy = new Set();       
let dueAt = new Map();      
let sslCache = new Map();   

const store = {
  memory: {},
  async get(key) {
    if (window.storage) {
      try { const hit = await window.storage.get(key); return hit ? hit.value : null; }
      catch (e) { return null; }
    }
    return this.memory[key] ?? null;
  },
  async set(key, value) {
    if (window.storage) {
      try { await window.storage.set(key, value); return; } catch (e) { /* fall through */ }
    }
    this.memory[key] = value;
  }
};

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set(STORE_KEY, JSON.stringify(state)), 250);
}

async function load() {
  const saved = await store.get(STORE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.sites)) state = parsed;
    } catch (e) { /* corrupt save, start fresh */ }
  }
  if (!state.sites.length) {
    FIRST_RUN_SITES.forEach(site => addSite(site.name, site.url, site.interval, true));
  }
}


function safe(text) {
  return String(text).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
}

function stamp(when = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return when.getFullYear() + "-" + pad(when.getMonth() + 1) + "-" + pad(when.getDate()) +
         " " + pad(when.getHours()) + ":" + pad(when.getMinutes()) + ":" + pad(when.getSeconds());
}

function seconds(ms) {
  return (ms / 1000).toFixed(2) + "s";
}

function log(message) {
  logLines.unshift("[" + stamp() + "] " + message);
  logLines = logLines.slice(0, MAX_LOG);
  drawLog();
}


async function attempt(url, mode) {
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), TIMEOUT * 1000);
  const started = performance.now();
  try {
    const reply = await fetch(url, { mode, cache: "no-store", redirect: "follow", signal: stop.signal });
    return { answered: true, reply, ms: Math.round(performance.now() - started) };
  } catch (error) {
    return { answered: false, error, ms: Math.round(performance.now() - started) };
  } finally {
    clearTimeout(timer);
  }
}

async function checkSite(url) {
  const open = await attempt(url, "cors");
  if (open.answered) {
    const code = open.reply.status;
    return {
      status: code < 400 ? "UP" : "DOWN",
      code,
      ms: open.ms,
      error: code < 400 ? null : "HTTP " + code,
      time: stamp()
    };
  }

  const hidden = await attempt(url, "no-cors");
  if (hidden.answered) {
    return { status: "UP", code: null, ms: hidden.ms, error: null, time: stamp() };
  }

  const timedOut = hidden.error && hidden.error.name === "AbortError";
  let error = timedOut ? "No response within " + TIMEOUT + "s" : "No response";
  if (!timedOut && location.protocol === "https:" && url.startsWith("http://")) {
    error = "Blocked: page is https, site is http";
  }
  return { status: "DOWN", code: null, ms: null, error, time: stamp() };
}


async function sslDaysLeft(url) {
  if (!SSL_LOOKUP) return null;
  let host;
  try { host = new URL(url); } catch (e) { return null; }
  if (host.protocol !== "https:") return null;

  const cached = sslCache.get(host.hostname);
  if (cached && Date.now() - cached.at < 3600000) return cached.days;

  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), TIMEOUT * 1000);
  try {
    const reply = await fetch(SSL_LOOKUP.replace("{host}", encodeURIComponent(host.hostname)),
                              { signal: stop.signal });
    const data = await reply.json();
    const found = findDays(data);
    sslCache.set(host.hostname, { days: found, at: Date.now() });
    return found;
  } catch (e) {
    sslCache.set(host.hostname, { days: null, at: Date.now() });
    return null;
  } finally {
    clearTimeout(timer);
  }
}


function findDays(data) {
  const keys = ["days_left", "daysLeft", "daysleft", "days_until_expiry", "daysUntilExpiry"];
  const seen = new Set();
  const walk = value => {
    if (!value || typeof value !== "object" || seen.has(value)) return null;
    seen.add(value);
    for (const key of keys) {
      if (typeof value[key] === "number") return value[key];
      if (typeof value[key] === "string" && value[key].trim() !== "" && !isNaN(value[key])) return Number(value[key]);
    }
    for (const child of Object.values(value)) {
      const found = walk(child);
      if (found !== null) return found;
    }
    return null;
  };
  return walk(data);
}

async function runCheck(site) {
  if (busy.has(site.id)) return;
  busy.add(site.id);

  const result = await checkSite(site.url);
  result.ssl = result.status === "UP" ? await sslDaysLeft(site.url) : null;

  const before = site.last;
  site.last = result;
  site.history.push({ t: Date.now(), status: result.status, ms: result.ms });
  if (site.history.length > MAX_HISTORY) site.history = site.history.slice(-MAX_HISTORY);
  busy.delete(site.id);

  log(result.status === "UP"
      ? site.name + " is UP (" + seconds(result.ms) + ")"
      : site.name + " is DOWN");

  if (before && before.status !== result.status) {
    if (result.status === "DOWN") {
      sendEmail("\uD83D\uDEA8 " + site.name + " is DOWN",
                site.name + " is not responding.\nURL: " + site.url +
                "\nTime: " + result.time, site);
    } else {
      sendEmail("\uD83D\uDFE2 " + site.name + " is back UP",
                site.name + " is responding again (" + seconds(result.ms) + ").\nURL: " + site.url +
                "\nTime: " + result.time, site);
    }
  }

  if (result.ssl !== null && result.ssl <= SSL_WARN_DAYS) {
    log("SSL warning: " + site.name + " certificate expires in " + result.ssl + " days");
  }

  save();
  draw();
}

function checkAllNow() {
  state.sites.forEach(site => {
    dueAt.set(site.id, Date.now() + site.interval * 1000);
    runCheck(site);
  });
}


setInterval(() => {
  if (!state.monitoring) return;
  const now = Date.now();
  state.sites.forEach(site => {
    if (now >= (dueAt.get(site.id) ?? 0)) {
      dueAt.set(site.id, now + site.interval * 1000);
      runCheck(site);
    }
  });
}, 1000);


function getStats(site) {
  const cutoff = Date.now() - RETAIN_DAYS * 86400000;
  const recent = site.history.filter(entry => entry.t >= cutoff);
  const up = recent.filter(entry => entry.status === "UP");
  const times = up.map(entry => entry.ms).filter(ms => typeof ms === "number");
  return {
    total: recent.length,
    up: up.length,
    down: recent.length - up.length,
    uptime: recent.length ? (up.length / recent.length * 100).toFixed(1) : null,
    average: times.length ? times.reduce((a, b) => a + b, 0) / times.length : null
  };
}


async function sendEmail(subject, message, site) {
  if (!state.email) {
    log("No alert email saved");
    return false;
  }
  if (!ALERT_ENDPOINT) {
    log("Email not sent: add an ALERT_ENDPOINT near the top of this file");
    return false;
  }
  try {
    const reply = await fetch(ALERT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        to: state.email,
        subject,
        message: message + "\n\n-- Uptime Sentinel",
        site: site ? site.name : null,
        url: site ? site.url : null,
        status: site && site.last ? site.last.status : null
      })
    });
    if (!reply.ok) throw new Error("HTTP " + reply.status);
    log("Email alert sent to " + state.email);
    return true;
  } catch (error) {
    log("Email alert failed (" + error.message + ")");
    return false;
  }
}


function row(name, value, tone) {
  return '<p class="line"><span class="name">' + name + '</span>' +
         '<span class="value ' + (tone || "") + '">' + value + "</span></p>";
}

function buildCard(site) {
  const result = site.last;
  const stats = getStats(site);
  const lines = [];
  let colour;

  if (!result) {
    colour = "down";
    lines.push(row("Status", "Not checked yet", "warn"));
  } else if (result.status === "UP") {
    colour = "up";
    lines.push(row("Status", "UP", "ok"));
    lines.push(row("HTTP Code", result.code ?? "\u2014"));
    lines.push(row("Response Time", seconds(result.ms)));
  } else {
    colour = "down";
    lines.push(row("Status", "DOWN", "bad"));
    lines.push(row("Error", safe(result.error || "No response")));
  }

  if (result && result.ssl !== null && result.ssl !== undefined) {
    lines.push(row("SSL expires in", result.ssl + " days", result.ssl <= SSL_WARN_DAYS ? "warn" : ""));
  }

  if (stats.total) {
    lines.push(row("Checks (7 days)", stats.total + " (" + stats.up + " up / " + stats.down + " down)"));
    lines.push(row("Uptime", stats.uptime + "%"));
    if (stats.average !== null) lines.push(row("Avg response", seconds(stats.average)));
  }

  const when = result ? "Last checked: " + result.time : "Interval: " + site.interval + "s";

  return '<div class="card ' + colour + '">' +
           '<div class="x"><button data-remove="' + site.id + '" title="Remove" aria-label="Remove ' + safe(site.name) + '">&#10005;</button></div>' +
           '<span class="dot"></span><h2>' + safe(site.name) + "</h2>" +
           '<p class="url">' + safe(site.url) + "</p>" +
           lines.join("") +
           '<p class="small">' + when + "</p>" +
         "</div>";
}

function draw() {
  document.getElementById("cards").innerHTML = state.sites.map(buildCard).join("");
  const flag = document.getElementById("mon-state");
  flag.textContent = state.monitoring ? "running" : "stopped";
  flag.className = state.monitoring ? "ok" : "bad";
  document.getElementById("btn-toggle").textContent = state.monitoring ? "Stop monitoring" : "Start monitoring";
}

function drawLog() {
  document.getElementById("log").innerHTML =
    logLines.length ? logLines.map(safe).join("<br>") : "Ready.";
}


function addSite(name, url, interval, quiet) {
  const site = {
    id: state.nextId++,
    name: name || url,
    url,
    interval: Math.max(5, Number(interval) || 60),
    history: [],
    last: null
  };
  state.sites.push(site);
  if (!quiet) log("Added " + site.name);
  save();
  draw();
  runCheck(site);
  return site;
}

document.getElementById("btn-add").addEventListener("click", () => {
  const name = document.getElementById("in-name").value.trim();
  const interval = document.getElementById("in-interval").value;
  let url = document.getElementById("in-url").value.trim();
  if (!url) { log("Enter a web address before adding a site"); return; }
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  addSite(name, url, interval);
  document.getElementById("in-name").value = "";
  document.getElementById("in-url").value = "";
});

document.getElementById("in-url").addEventListener("keydown", event => {
  if (event.key === "Enter") document.getElementById("btn-add").click();
});

document.getElementById("cards").addEventListener("click", event => {
  const button = event.target.closest("[data-remove]");
  if (!button) return;
  const id = Number(button.dataset.remove);
  state.sites = state.sites.filter(entry => entry.id !== id);
  dueAt.delete(id);
  log("Website removed");
  save();
  draw();
});

document.getElementById("btn-check").addEventListener("click", checkAllNow);

document.getElementById("btn-toggle").addEventListener("click", () => {
  state.monitoring = !state.monitoring;
  dueAt.clear();
  log(state.monitoring ? "Monitoring started" : "Monitoring stopped");
  save();
  draw();
});

document.getElementById("btn-clear").addEventListener("click", () => {
  state.sites.forEach(site => { site.history = []; site.last = null; });
  log("History cleared");
  save();
  draw();
});

document.getElementById("btn-save-email").addEventListener("click", () => {
  state.email = document.getElementById("in-email").value.trim();
  log(state.email ? "Alert email saved" : "Alert email removed");
  save();
});

document.getElementById("btn-test").addEventListener("click", () => {
  state.email = document.getElementById("in-email").value.trim();
  save();
  sendEmail("\u2705 Uptime Sentinel test alert",
            "It works! Alerts will be sent to this address when a monitored website goes DOWN or comes back UP.");
});


(async function start() {
  await load();
  document.getElementById("in-email").value = state.email || "";
  drawLog();
  draw();
  log("Uptime Sentinel started");
  checkAllNow();
})();
</script>
</body>
</html>
